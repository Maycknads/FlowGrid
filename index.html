<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowGrid | Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1><span>FLOW</span>GRID</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Nome da Tarefa...">
            <button class="btn-neon" onclick="createTask()">CRIAR HÁBITO</button>
        </div>

        <div class="input-group">
            <select id="taskSelector" onchange="renderTable()"></select>
            <button class="btn-neon" onclick="deleteTask()" style="background: #ff4757;">EXCLUIR</button>
        </div>

        <div id="tableContainer"></div>
        <div id="counter" style="text-align: center; margin-top: 15px; font-weight: bold; color: #00f2ff;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
